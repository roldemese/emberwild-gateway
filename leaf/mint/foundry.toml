# SIMULATION / NOT DEPLOYED
# Forge runs these tests on its in-memory chain (id 31337). There is no RPC,
# no broadcast profile, and no path onto a public network.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = []
allow_paths = ["../../node_modules"]
evm_version = "cancun"
bytecode_hash = "ipfs"
gas_limit = 100000000

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 20
fail_on_revert = false
